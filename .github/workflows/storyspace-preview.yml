name: Storyspace build

on:
  push:
    branches: [main]
    paths:
      - 'storyspace-vite/.preview'
      - '.github/workflows/storyspace-preview.yml'

permissions:
  contents: read

concurrency:
  group: storyspace-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storyspace-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storyspace-vite/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Create self-contained HTML
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const dist = path.resolve('dist');
          let html = fs.readFileSync(path.join(dist, 'index.html'), 'utf8');

          html = html.replace(
            /<link\s+rel="stylesheet"[^>]*href="([^"]+)"[^>]*>/g,
            (_, href) => {
              const file = path.join(dist, href.replace(/^\.\//, '').replace(/^\//, ''));
              const css = fs.readFileSync(file, 'utf8');
              return '<style>' + css + '</style>';
            },
          );

          html = html.replace(
            /<script\s+type="module"[^>]*src="([^"]+)"[^>]*><\/script>/g,
            (_, src) => {
              const file = path.join(dist, src.replace(/^\.\//, '').replace(/^\//, ''));
              const js = fs.readFileSync(file, 'utf8').replace(/<\/script>/g, '<\\/script>');
              return '<script type="module">' + js + '</script>';
            },
          );

          fs.writeFileSync(path.join(dist, 'storyspace.html'), html);
          NODE

      - name: Upload conversation preview
        uses: actions/upload-artifact@v4
        with:
          name: storyspace-html
          path: storyspace-vite/dist/storyspace.html
          if-no-files-found: error
          retention-days: 7
