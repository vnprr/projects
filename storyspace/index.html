<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#090a0d" />
<title>Storyspace Alpha — Live UX Prototype</title>
<link rel="stylesheet" href="https://esm.sh/@xyflow/react@12.11.6/dist/style.css" />
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f6f8;background:#090a0d;--safe-t:max(14px,env(safe-area-inset-top));--safe-r:max(14px,env(safe-area-inset-right));--safe-b:max(14px,env(safe-area-inset-bottom));--safe-l:max(14px,env(safe-area-inset-left));--h:226}
*{box-sizing:border-box}html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#090a0d}body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.025),transparent 45%),#090a0d}.ambient{position:absolute;inset:-22%;z-index:-3;pointer-events:none;overflow:hidden}.wash{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(100px);opacity:.18;transition:background 700ms ease}.wash.a{left:0;top:0;background:radial-gradient(circle,hsla(var(--h),46%,48%,.48),transparent 68%);animation:driftA 17s ease-in-out infinite alternate}.wash.b{right:-10%;bottom:-14%;background:radial-gradient(circle,hsla(calc(var(--h) + 46),42%,36%,.35),transparent 70%);animation:driftB 22s ease-in-out infinite alternate}.grain{position:absolute;inset:0;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E");mix-blend-mode:soft-light}@keyframes driftA{to{transform:translate3d(7vw,4vh,0) scale(1.08)}}@keyframes driftB{to{transform:translate3d(-6vw,-3vh,0) scale(.95)}}
.depth{position:absolute;z-index:80;left:max(18px,calc(env(safe-area-inset-left) + 7px));top:50%;transform:translateY(-50%);display:grid;gap:11px}.depth button{border:0;background:none;padding:5px;opacity:.26;transition:.18s}.depth button.on{opacity:.95;transform:scale(1.3)}.depth span{display:block;width:3px;height:18px;border-radius:9px;background:rgba(255,255,255,.76)}
.scene{position:absolute;inset:0;animation:enter .34s cubic-bezier(.2,.8,.2,1)}@keyframes enter{from{opacity:0;transform:scale(.985);filter:blur(3px)}}
/* FLOW */.flow{display:grid;place-items:center;touch-action:none;user-select:none;perspective:1200px}.orbit{position:absolute;width:min(72vw,950px);height:min(72vw,950px);border-radius:50%;border:1px solid rgba(255,255,255,.028);box-shadow:inset 0 0 0 12vw rgba(255,255,255,.006),0 0 130px hsla(var(--h),40%,50%,.025)}.current{position:relative;z-index:5;width:min(680px,62vw);padding:28px 14px 34px;cursor:text}.current:before,.current:after{content:"";position:absolute;left:14px;width:56px;height:1px;background:rgba(255,255,255,.12)}.current:before{top:0}.current:after{bottom:0}.meta{display:flex;align-items:center;gap:8px;margin-bottom:24px;color:rgba(255,255,255,.24);font-size:10px;letter-spacing:.08em}.meta i{width:22px;height:1px;background:rgba(255,255,255,.12)}.current h1{max-width:16ch;margin:0;font:470 clamp(44px,6vw,84px)/.98 Georgia,serif;letter-spacing:-.045em;text-wrap:balance}.current p{max-width:52ch;margin:26px 0 0;color:rgba(255,255,255,.52);font:400 clamp(15px,1.45vw,19px)/1.62 Georgia,serif}.tapwrite{margin-top:24px;color:rgba(255,255,255,.18);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:.18s}.current:hover .tapwrite{opacity:1}.neighbor{position:absolute;z-index:4;border:0;background:none;padding:18px;text-align:left;opacity:.28;transition:.2s}.neighbor:hover,.neighbor.sel{opacity:.8}.neighbor span,.neighbor small{display:block;margin-bottom:8px;color:rgba(255,255,255,.28);font-size:9px;letter-spacing:.13em;text-transform:uppercase}.neighbor strong{display:block;max-width:18ch;color:rgba(255,255,255,.76);font:460 clamp(15px,1.3vw,19px)/1.2 Georgia,serif}.neighbor small{max-width:26ch;margin-top:8px;text-transform:none;letter-spacing:0;line-height:1.4}.prev{left:4vw;top:50%;transform:translateY(-50%) rotateY(16deg)}.next{right:4vw;top:50%;transform:translateY(-50%) rotateY(-16deg)}.branch1{top:34%}.branch2{top:66%}.hint{position:absolute;left:50%;bottom:var(--safe-b);transform:translateX(-50%);white-space:nowrap;color:rgba(255,255,255,.28);font-size:11px;letter-spacing:.04em}.mhint{display:none}
/* NOTE */.note{overflow:hidden;touch-action:pan-y}.paper{width:min(820px,calc(100vw - 128px));height:100%;margin:auto;padding:max(10vh,calc(var(--safe-t) + 46px)) 24px calc(var(--safe-b) + 32px);display:grid;grid-template-rows:auto 1fr;gap:28px}.title,.body{width:100%;border:0;outline:0;background:none;color:rgba(249,249,250,.94);border-radius:0}.title{font:460 clamp(38px,5vw,70px)/1.02 Georgia,serif;letter-spacing:-.04em}.body{min-height:0;resize:none;overflow-y:auto;scrollbar-width:none;padding:0 0 16vh;color:rgba(245,246,248,.73);caret-color:white;font:400 clamp(17px,1.65vw,22px)/1.72 Georgia,serif}.body::-webkit-scrollbar{display:none}.back{position:absolute;z-index:20;top:var(--safe-t);left:max(18px,calc(var(--safe-l) + 4px));width:40px;height:40px;border:0;background:none;opacity:.25}.back:after{content:"";display:block;width:18px;height:1px;background:rgba(255,255,255,.78);box-shadow:0 -5px rgba(255,255,255,.28)}
/* CANVAS */.map{background:transparent}.maplabel{position:absolute;z-index:30;top:var(--safe-t);left:max(48px,calc(var(--safe-l) + 30px));display:flex;gap:10px;align-items:baseline;color:rgba(255,255,255,.58)}.maplabel small{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.25)}.maphint{position:absolute;z-index:30;left:50%;bottom:var(--safe-b);transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:11px}.react-flow__edge-path{stroke:rgba(255,255,255,.15)!important;stroke-width:1.3!important}.rfnode{width:168px;min-height:70px;padding:14px 15px;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(12,13,17,.72);box-shadow:0 18px 50px rgba(0,0,0,.16)}.rfnode.cur{border-color:rgba(255,255,255,.4);box-shadow:0 20px 70px rgba(0,0,0,.25),0 0 0 1px hsla(var(--h),50%,70%,.08)}.rfnode.branch{border-style:dashed}.rfnode b{display:block;font-size:12px;font-weight:560;line-height:1.25}.rfnode p{margin:7px 0 0;color:rgba(255,255,255,.35);font-size:8.5px;line-height:1.4}.react-flow__handle{width:5px!important;height:5px!important;border:0!important;background:rgba(255,255,255,.25)!important}
@media(max-width:640px){.depth{top:calc(var(--safe-t) + 5px);left:50%;transform:translateX(-50%);display:flex;gap:8px}.depth span{width:14px;height:2px}.app.notelevel .depth{opacity:0;pointer-events:none}.flow{place-items:stretch;padding:calc(var(--safe-t) + 42px) var(--safe-r) calc(var(--safe-b) + 44px) var(--safe-l);perspective:none}.orbit{width:116vw;height:116vw;left:-8vw;top:16%;opacity:.55}.current{width:100%;align-self:center;padding:18px 4px 24px}.current h1{max-width:13ch;font-size:clamp(42px,13.2vw,62px);line-height:.96}.current p{max-width:94%;font-size:16px;line-height:1.58;margin-top:22px}.meta{margin-bottom:18px}.tapwrite{display:none}.neighbor{padding:10px 2px;opacity:.18}.neighbor strong{font-size:13px;max-width:14ch}.neighbor span,.neighbor small{font-size:8px}.prev{left:var(--safe-l);top:auto;bottom:calc(var(--safe-b) + 25px);transform:none}.next{right:var(--safe-r);top:auto;bottom:calc(var(--safe-b) + 25px);transform:none;text-align:right}.branch1{top:auto;bottom:calc(var(--safe-b) + 84px)}.branch2{top:auto;bottom:calc(var(--safe-b) + 20px)}.dhint{display:none}.mhint{display:inline}.hint{bottom:calc(var(--safe-b) + 2px);font-size:9px}.paper{width:100%;margin:0;padding:calc(var(--safe-t) + 34px) max(22px,calc(var(--safe-r) + 6px)) calc(var(--safe-b) + 8px) max(22px,calc(var(--safe-l) + 6px));gap:22px}.title{font-size:clamp(35px,11vw,52px);line-height:.98}.body{font-size:18px;line-height:1.68;padding-bottom:30vh}.back{top:calc(var(--safe-t) - 4px);left:calc(var(--safe-l) - 6px);width:32px;height:32px;opacity:.13}.maplabel{left:var(--safe-l)}.maphint{font-size:10px}.rfnode{width:150px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body><div id="root"></div>
<script type="module">
import React,{useCallback,useEffect,useMemo,useRef,useState} from 'https://esm.sh/react@19.3.0';
import {createRoot} from 'https://esm.sh/react-dom@19.3.0/client';
import htm from 'https://esm.sh/htm@3.1.1';
import {ReactFlow,ReactFlowProvider,Background,Handle,Position,useNodesState} from 'https://esm.sh/@xyflow/react@12.11.6?external=react,react-dom';
const html=htm.bind(React.createElement);
const now=new Date().toISOString();
const seed={id:'afterlight',title:'Afterlight',entryNodeId:'n01',nodes:[
['n01','The platform before dawn','The city is still asleep when Mara reaches the empty platform. Rain hangs in the air like dust.',0,120,214],
['n02','A message with no sender','Her phone vibrates once. The message contains only a time, a station number, and a sentence she remembers from childhood.',300,120,226],
['n03','The closed station','Gate 7 should have been sealed for years. Tonight, the lock is open.',600,120,236],
['n04','Where the path divides','Below the stairs, the corridor splits. Warm market light flickers to the right. The old service tunnel breathes cold air from the left.',900,120,248],
['n05','The service tunnel','The tiles give way to wet concrete. Someone has drawn a white line along the wall, always just above eye level.',1200,-40,263],
['n06','The night market','Every stall is open, but no one is selling anything. The vendors watch a silent television suspended above the aisle.',1200,280,22],
['n07','Under the bridge','Both routes return to the river. A figure waits under the railway bridge, holding the same umbrella Mara lost ten years ago.',1510,120,191],
['n08','The archive room','Inside the municipal archive, the lights wake one row at a time. A file already lies open on the desk.',1810,120,171],
['n09','The lighthouse file','The photographs show a lighthouse that has never existed on any map of the city.',2110,120,153],
['n10','The confession','Mara finally understands why her father never spoke about the winter of 1998.',2410,120,338],
['n11','The last train','There is one train left on the board. It has no destination, only a departure time.',2710,120,306],
['n12','Afterlight','When morning reaches the river, the city looks almost unchanged. Almost.',3010,120,46]
].map(([id,title,text,x,y,hue])=>({id,title,text,position:{x,y},createdAt:now,updatedAt:now,hue})),edges:[
['e01','n01','n02','next'],['e02','n02','n03','next'],['e03','n03','n04','next'],['e04a','n04','n05','branch'],['e04b','n04','n06','branch'],['e05','n05','n07','next'],['e06','n06','n07','next'],['e07','n07','n08','next'],['e08','n08','n09','next'],['e09','n09','n10','next'],['e10','n10','n11','next'],['e11','n11','n12','next']
].map(([id,from,to,type])=>({id,from,to,type}))};
const KEY='storyspace.live.v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed}catch{return seed}}
function App(){
 const [project,setProject]=useState(load); const [level,setLevel]=useState('flow'); const [currentId,setCurrentId]=useState(project.entryNodeId); const [history,setHistory]=useState([]); const [branchIndex,setBranchIndex]=useState(0); const touch=useRef(null); const pinch=useRef(null); const wheel=useRef(0); const wheelLock=useRef(false);
 useEffect(()=>localStorage.setItem(KEY,JSON.stringify(project)),[project]);
 const node=project.nodes.find(n=>n.id===currentId)||project.nodes[0]; const outgoing=project.edges.filter(e=>e.from===currentId).map(e=>({e,n:project.nodes.find(n=>n.id===e.to)})).filter(x=>x.n); const incoming=project.edges.filter(e=>e.to===currentId).map(e=>project.nodes.find(n=>n.id===e.from)).filter(Boolean); const prev=project.nodes.find(n=>n.id===history.at(-1))||incoming[0]||null;
 useEffect(()=>{document.documentElement.style.setProperty('--h',node.hue||220);setBranchIndex(0)},[currentId]);
 const go=useCallback((id)=>{if(!id||id===currentId)return;setHistory(h=>[...h,currentId].slice(-64));setCurrentId(id)},[currentId]);
 const back=useCallback(()=>{const p=history.at(-1);if(p){setHistory(h=>h.slice(0,-1));setCurrentId(p)}else if(prev)go(prev.id)},[history,prev,go]);
 const next=useCallback(()=>{const x=outgoing[Math.min(branchIndex,Math.max(0,outgoing.length-1))];if(x)go(x.n.id)},[outgoing,branchIndex,go]);
 useEffect(()=>{const fn=e=>{if(level==='note'){if(e.key==='Escape')setLevel('flow');return}if(level==='canvas'){if(e.key==='Escape')setLevel('flow');return}if(e.key==='Escape')setLevel('canvas');else if(e.key==='Enter')setLevel('note');else if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){e.preventDefault();back()}else if(outgoing.length>1&&(e.key==='ArrowDown'||e.key.toLowerCase()==='s')){e.preventDefault();setBranchIndex(i=>(i+1)%outgoing.length)}else if(outgoing.length>1&&(e.key==='ArrowUp'||e.key.toLowerCase()==='w')){e.preventDefault();setBranchIndex(i=>(i-1+outgoing.length)%outgoing.length)}};window.addEventListener('keydown',fn);return()=>window.removeEventListener('keydown',fn)},[level,next,back,outgoing.length]);
 const gestures={onPointerDown:e=>{if(e.pointerType==='touch')touch.current={x:e.clientX,y:e.clientY}},onPointerUp:e=>{if(!touch.current||e.pointerType!=='touch')return;const dx=e.clientX-touch.current.x,dy=e.clientY-touch.current.y;touch.current=null;if(Math.max(Math.abs(dx),Math.abs(dy))<52)return;if(Math.abs(dx)>Math.abs(dy)){dx<0?next():back()}else if(outgoing.length>1){dy<0?setBranchIndex(i=>(i+1)%outgoing.length):setBranchIndex(i=>(i-1+outgoing.length)%outgoing.length)}},onTouchStart:e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinch.current=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}},onTouchMove:e=>{if(e.touches.length!==2||!pinch.current)return;const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),r=d/pinch.current;if(r>1.23){pinch.current=null;if(level==='flow')setLevel('note');else if(level==='canvas')setLevel('flow')}else if(r<.77){pinch.current=null;if(level==='note')setLevel('flow');else if(level==='flow')setLevel('canvas')}},onTouchEnd:()=>pinch.current=null};
 const update=(id,title,text)=>setProject(p=>({...p,nodes:p.nodes.map(n=>n.id===id?{...n,title,text,updatedAt:new Date().toISOString()}:n)}));
 return html`<main className=${'app '+(level==='note'?'notelevel':'')}>
  <div className="ambient"><div className="wash a"></div><div className="wash b"></div><div className="grain"></div></div>
  <nav className="depth">${['canvas','flow','note'].map(x=>html`<button className=${level===x?'on':''} onClick=${()=>setLevel(x)} aria-label=${x}><span></span></button>`)}</nav>
  ${level==='flow'?html`<section className="scene flow" ...${gestures} onWheel=${e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setLevel(e.deltaY<0?'note':'canvas');return}if(wheelLock.current)return;const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;wheel.current+=d;if(Math.abs(wheel.current)>75){const dir=Math.sign(wheel.current);wheel.current=0;wheelLock.current=true;setTimeout(()=>wheelLock.current=false,340);dir>0?next():back()}}>
   <div className="orbit"></div>
   ${prev&&html`<button className="neighbor prev" onClick=${back}><span>before</span><strong>${prev.title}</strong></button>`}
   <article className="current" onClick=${()=>setLevel('note')}><div className="meta"><span>${project.nodes.findIndex(n=>n.id===currentId)+1}</span><i></i><span>${project.nodes.length}</span></div><h1>${node.title}</h1><p>${node.text}</p><div className="tapwrite">tap to write</div></article>
   ${outgoing.map(({e,n},i)=>html`<button className=${'neighbor next '+(outgoing.length>1?(i===0?'branch1':'branch2'):'')+(i===branchIndex?' sel':'')} onMouseEnter=${()=>setBranchIndex(i)} onClick=${()=>go(n.id)}><span>${outgoing.length>1?'path '+(i+1):'next'}</span><strong>${n.title}</strong>${outgoing.length>1&&html`<small>${n.text.slice(0,72)}…</small>`}</button>`)}
   <div className="hint"><span className="dhint">scroll / arrows · tap center to write · pinch / esc for map</span><span className="mhint">swipe to move · tap to write · pinch for depth</span></div>
  </section>`:level==='note'?html`<${Note} key=${node.id} node=${node} update=${update} exit=${()=>setLevel('flow')} gestures=${gestures}/>`:html`<${Canvas} project=${project} currentId=${currentId} setCurrentId=${setCurrentId} enter=${id=>{setCurrentId(id);setLevel('flow')}} setProject=${setProject}/>`}
 </main>`
}
function Note({node,update,exit,gestures}){const [title,setTitle]=useState(node.title),[text,setText]=useState(node.text),body=useRef(null);useEffect(()=>{const t=setTimeout(()=>update(node.id,title,text),500);return()=>clearTimeout(t)},[title,text]);return html`<section className="scene note" ...${gestures}><button className="back" onClick=${()=>{update(node.id,title,text);exit()}} aria-label="Back to flow"></button><div className="paper"><input className="title" value=${title} onInput=${e=>setTitle(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter'){e.preventDefault();body.current?.focus()}}}/><textarea ref=${body} className="body" value=${text} onInput=${e=>setText(e.target.value)} placeholder="Write…"></textarea></div></section>`}
function StoryNode({data}){return html`<div className=${'rfnode '+(data.current?'cur ':'')+(data.branch?'branch':'')}><${Handle} type="target" position=${Position.Left}/><b>${data.title}</b><p>${data.preview}</p><${Handle} type="source" position=${Position.Right}/></div>`}
const nodeTypes={story:StoryNode};
function CanvasInner({project,currentId,setCurrentId,enter,setProject}){const mk=()=>project.nodes.map(n=>({id:n.id,type:'story',position:n.position||{x:0,y:0},data:{title:n.title,preview:n.text.slice(0,94),current:n.id===currentId,branch:project.edges.filter(e=>e.from===n.id).length>1}}));const [nodes,setNodes,onNodesChange]=useNodesState(mk());useEffect(()=>setNodes(mk()),[project,currentId]);const edges=useMemo(()=>project.edges.map(e=>({id:e.id,source:e.from,target:e.to,type:'smoothstep',style:{strokeDasharray:e.type==='branch'?'4 7':undefined}})),[project.edges]);return html`<section className="scene map"><div className="maplabel"><span>${project.title}</span><small>map</small></div><${ReactFlow} nodes=${nodes} edges=${edges} nodeTypes=${nodeTypes} onNodesChange=${onNodesChange} fitView fitViewOptions=${{padding:.22,maxZoom:.78}} minZoom=${.18} maxZoom=${2} panOnScroll zoomOnScroll=${false} zoomOnPinch selectionOnDrag=${false} proOptions=${{hideAttribution:true}} onNodeClick=${(_,n)=>setCurrentId(n.id)} onNodeDoubleClick=${(_,n)=>enter(n.id)} onNodeDragStop=${(_,n)=>setProject(p=>({...p,nodes:p.nodes.map(x=>x.id===n.id?{...x,position:n.position}:x)}))}><${Background} gap=${34} size=${1}/></${ReactFlow}><div className="maphint">double tap a node · pinch closer</div></section>`}
function Canvas(props){return html`<${ReactFlowProvider}><${CanvasInner} ...${props}/></${ReactFlowProvider}>`}
createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
